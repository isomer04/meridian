[project]
name = "meridian"
version = "0.1.0"
description = "Agentic loan origination for home lending — deterministic orchestrator, LLM judgment"
requires-python = ">=3.10,<3.14"
dependencies = [
    "cryptography>=45.0",
    "crewai[tools]>=1.14.5",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.135",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# uv syncs the `dev` dependency-group by default, so `uv sync` alone gives a reviewer a
# runnable test suite. The optional-dependencies entry above is kept for pip users.
[dependency-groups]
dev = ["pytest>=8.0", "pyvis>=0.3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.hatch.build.targets.wheel.force-include]
"evals/run_evals.py" = "meridian/_evals/run_evals.py"
"evals/golden_set.json" = "meridian/_evals/golden_set.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]
